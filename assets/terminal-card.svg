<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 310" width="100%" height="310">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050907" />
      <stop offset="50%" stop-color="#020f06" />
      <stop offset="100%" stop-color="#050907" />
    </linearGradient>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor { animation: blink 1s infinite; fill: #00ff41; }
      .syntax-kw { fill: #00ff41; font-weight: bold; }
      .syntax-prop { fill: #ffffff; }
      .syntax-str { fill: #86efac; }
      .syntax-comment { fill: #166534; font-style: italic; }
      .term-code { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 13.5px; }
    </style>
  </defs>

  <!-- Terminal Frame -->
  <rect x="2" y="2" width="846" height="306" rx="10" fill="url(#termBg)" stroke="#00ff41" stroke-width="1.4" filter="url(#greenGlow)" />

  <!-- Terminal Title Bar -->
  <rect x="2" y="2" width="846" height="36" rx="10" fill="#011407" />
  <rect x="2" y="28" width="846" height="10" fill="#011407" />
  <line x1="2" y1="38" x2="848" y2="38" stroke="#003811" stroke-width="1" />

  <!-- Terminal Buttons -->
  <circle cx="22" cy="19" r="6" fill="#ff5f56" />
  <circle cx="42" cy="19" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="19" r="6" fill="#27c93f" />

  <!-- Terminal Title -->
  <text x="425" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00ff41" font-weight="600" letter-spacing="1">
    bash &mdash; root@matrix-node-01: ~ /identity_manifest.sh
  </text>

  <!-- Terminal Code Body -->
  <g class="term-code" transform="translate(28, 68)">
    <text y="0">
      <tspan class="syntax-comment">// 01001000 01000001 01001011 01000101 01010010 // SYSTEM INITIALIZED</tspan>
    </text>
    <text y="26">
      <tspan class="syntax-kw">const </tspan><tspan class="syntax-prop">operative </tspan><tspan fill="#00ff41">= </tspan><tspan fill="#ffffff">{</tspan>
    </text>
    <text y="52">
      <tspan fill="#ffffff">  codename: </tspan><tspan class="syntax-str">'Piyush Kumar'</tspan><tspan fill="#ffffff">, </tspan><tspan class="syntax-comment">// alias: ctrlaltsolveorg-cloud</tspan>
    </text>
    <text y="78">
      <tspan fill="#ffffff">  classification: </tspan><tspan class="syntax-str">'Full-Stack Systems Architect &amp; AI Engineer'</tspan><tspan fill="#ffffff">,</tspan>
    </text>
    <text y="104">
      <tspan fill="#ffffff">  cipherStack: </tspan><tspan fill="#ffffff">[</tspan><tspan class="syntax-str">'Next.js 15'</tspan><tspan fill="#ffffff">, </tspan><tspan class="syntax-str">'TypeScript'</tspan><tspan fill="#ffffff">, </tspan><tspan class="syntax-str">'Supabase'</tspan><tspan fill="#ffffff">, </tspan><tspan class="syntax-str">'Postgres'</tspan><tspan fill="#ffffff">, </tspan><tspan class="syntax-str">'Docker'</tspan><tspan fill="#ffffff">],</tspan>
    </text>
    <text y="130">
      <tspan fill="#ffffff">  flagshipPayload: </tspan><tspan class="syntax-str">'HORIZON — Home Tuition Architecture'</tspan><tspan fill="#ffffff">,</tspan>
    </text>
    <text y="156">
      <tspan fill="#ffffff">  directive: </tspan><tspan class="syntax-str">'Break architectural bottlenecks. Zero latency. Ship immutable code.'</tspan>
    </text>
    <text y="182">
      <tspan fill="#ffffff">};</tspan>
    </text>
    <text y="210">
      <tspan class="syntax-kw">root@matrix-node-01</tspan><tspan fill="#ffffff">:</tspan><tspan fill="#00ff41">~# </tspan><tspan fill="#86efac">./verify_build.sh --status</tspan>
    </text>
    <text y="234">
      <tspan fill="#22c55e">[OK] 200 PROD READY &bull; HIGH THROUGHPUT &bull; ALL SYSTEMS OPERATIONAL</tspan>
      <rect class="cursor" x="655" y="222" width="9" height="15" />
    </text>
  </g>
</svg>
