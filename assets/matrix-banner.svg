<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 250" width="100%" height="250">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080c" />
      <stop offset="40%" stop-color="#02140a" />
      <stop offset="70%" stop-color="#061e0e" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>

    <!-- Glowing Green Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes fall1 { 0% { transform: translateY(-160px); opacity: 0; } 20% { opacity: 0.8; } 80% { opacity: 0.8; } 100% { transform: translateY(270px); opacity: 0; } }
      @keyframes fall2 { 0% { transform: translateY(-180px); opacity: 0; } 30% { opacity: 0.7; } 80% { opacity: 0.7; } 100% { transform: translateY(270px); opacity: 0; } }
      @keyframes fall3 { 0% { transform: translateY(-140px); opacity: 0; } 25% { opacity: 0.9; } 85% { opacity: 0.9; } 100% { transform: translateY(270px); opacity: 0; } }
      @keyframes pulseBorder { 0%, 100% { stroke-opacity: 0.4; } 50% { stroke-opacity: 1; filter: drop-shadow(0 0 6px #00ff41); } }
      @keyframes scanline { 0% { transform: translateY(0); } 100% { transform: translateY(250px); } }
      @keyframes blinkCursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

      .col-1 { animation: fall1 4.2s infinite linear; }
      .col-2 { animation: fall2 3.5s infinite linear 0.7s; }
      .col-3 { animation: fall3 5s infinite linear 1.4s; }
      .col-4 { animation: fall1 3.8s infinite linear 2.1s; }
      .col-5 { animation: fall2 4.6s infinite linear 0.3s; }
      .col-6 { animation: fall3 3.9s infinite linear 1.8s; }
      .col-7 { animation: fall1 4.4s infinite linear 2.7s; }
      .col-8 { animation: fall2 3.6s infinite linear 1.1s; }

      .matrix-char { font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold; fill: #00ff41; }
      .matrix-dim { fill: #00661a; opacity: 0.6; }
      .matrix-head { fill: #ffffff; filter: url(#glow-soft); }
      .hud-line { stroke: #00ff41; stroke-width: 1.2; animation: pulseBorder 3s infinite ease-in-out; }
      .scanline-bar { fill: none; stroke: #00ff41; stroke-width: 1.5; stroke-opacity: 0.2; animation: scanline 4s infinite linear; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="950" height="250" rx="14" fill="url(#bgGrad)" stroke="#00ff41" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Cyber Grid Lines -->
  <g stroke="#003811" stroke-width="0.7" stroke-opacity="0.45">
    <line x1="0" y1="50" x2="950" y2="50" />
    <line x1="0" y1="100" x2="950" y2="100" />
    <line x1="0" y1="150" x2="950" y2="150" />
    <line x1="0" y1="200" x2="950" y2="200" />
    <line x1="100" y1="0" x2="100" y2="250" />
    <line x1="250" y1="0" x2="250" y2="250" />
    <line x1="400" y1="0" x2="400" y2="250" />
    <line x1="550" y1="0" x2="550" y2="250" />
    <line x1="700" y1="0" x2="700" y2="250" />
    <line x1="850" y1="0" x2="850" y2="250" />
  </g>

  <!-- Matrix Rain Streams (Background Layer) -->
  <g opacity="0.35">
    <!-- Col 1 -->
    <g class="col-1" transform="translate(45, 0)">
      <text class="matrix-char matrix-dim" x="0" y="20">0</text>
      <text class="matrix-char matrix-dim" x="0" y="40">1</text>
      <text class="matrix-char" x="0" y="60">0</text>
      <text class="matrix-char" x="0" y="80">1</text>
      <text class="matrix-char matrix-head" x="0" y="100">1</text>
    </g>
    <!-- Col 2 -->
    <g class="col-2" transform="translate(130, 0)">
      <text class="matrix-char matrix-dim" x="0" y="15">1</text>
      <text class="matrix-char matrix-dim" x="0" y="35">0</text>
      <text class="matrix-char" x="0" y="55">1</text>
      <text class="matrix-char" x="0" y="75">1</text>
      <text class="matrix-char matrix-head" x="0" y="95">0</text>
    </g>
    <!-- Col 3 -->
    <g class="col-3" transform="translate(210, 0)">
      <text class="matrix-char matrix-dim" x="0" y="20">0</text>
      <text class="matrix-char" x="0" y="45">1</text>
      <text class="matrix-char" x="0" y="70">0</text>
      <text class="matrix-char matrix-head" x="0" y="95">1</text>
    </g>
    <!-- Col 4 -->
    <g class="col-4" transform="translate(730, 0)">
      <text class="matrix-char matrix-dim" x="0" y="20">1</text>
      <text class="matrix-char" x="0" y="40">1</text>
      <text class="matrix-char" x="0" y="60">0</text>
      <text class="matrix-char" x="0" y="80">1</text>
      <text class="matrix-char matrix-head" x="0" y="100">0</text>
    </g>
    <!-- Col 5 -->
    <g class="col-5" transform="translate(810, 0)">
      <text class="matrix-char matrix-dim" x="0" y="15">0</text>
      <text class="matrix-char" x="0" y="35">1</text>
      <text class="matrix-char" x="0" y="55">0</text>
      <text class="matrix-char matrix-head" x="0" y="75">1</text>
    </g>
    <!-- Col 6 -->
    <g class="col-6" transform="translate(890, 0)">
      <text class="matrix-char matrix-dim" x="0" y="25">1</text>
      <text class="matrix-char" x="0" y="50">0</text>
      <text class="matrix-char" x="0" y="75">1</text>
      <text class="matrix-char matrix-head" x="0" y="100">1</text>
    </g>
  </g>

  <!-- Dynamic Scanline -->
  <line class="scanline-bar" x1="0" y1="0" x2="950" y2="0" />

  <!-- Cyber HUD Brackets -->
  <g class="hud-line">
    <!-- Top-Left -->
    <path d="M 25 50 L 25 25 L 50 25" fill="none" />
    <!-- Top-Right -->
    <path d="M 925 50 L 925 25 L 900 25" fill="none" />
    <!-- Bottom-Left -->
    <path d="M 25 200 L 25 225 L 50 225" fill="none" />
    <!-- Bottom-Right -->
    <path d="M 925 200 L 925 225 L 900 225" fill="none" />
  </g>

  <!-- Top Status Bar -->
  <text x="45" y="42" font-family="'JetBrains Mono', Courier, monospace" font-size="11" fill="#00ff41" letter-spacing="2">
    [ SYSTEM: ROOT ] // 01001000 01000001 01000011 01001011 // OPERATIVE: ONLINE
  </text>
  <text x="905" y="42" text-anchor="end" font-family="'JetBrains Mono', Courier, monospace" font-size="11" fill="#39ff14" letter-spacing="1">
    PORT 443 &bull; ENCRYPTED &bull; ZERO_LATENCY
  </text>

  <!-- Main Center Header -->
  <g transform="translate(475, 118)">
    <!-- Subtitle Binary Badge -->
    <text text-anchor="middle" y="-36" font-family="'JetBrains Mono', Courier, monospace" font-size="13" font-weight="700" fill="#00ff41" letter-spacing="6" opacity="0.85">
      &lt; 01000011 01010100 01010010 01001100 /&gt;
    </text>

    <!-- Main Title with Glow -->
    <text text-anchor="middle" y="15" font-family="'Courier New', 'JetBrains Mono', monospace" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="6" filter="url(#glow)">
      PIYUSH KUMAR
    </text>

    <!-- Secondary Title / Subtext -->
    <text text-anchor="middle" y="48" font-family="'JetBrains Mono', Courier, monospace" font-size="15" font-weight="600" fill="#39ff14" letter-spacing="2">
      FULL-STACK ARCHITECT &bull; AI SYSTEMS BUILDER &bull; CYBER RUNTIME
    </text>
  </g>

  <!-- Bottom HUD Status Line -->
  <line x1="70" y1="210" x2="880" y2="210" stroke="#003811" stroke-width="1" />
  <text x="475" y="226" text-anchor="middle" font-family="'JetBrains Mono', Courier, monospace" font-size="11" fill="#00aa2b" letter-spacing="3">
    [ CORE PROTOCOLS: NEXT.JS 15 &bull; TYPESCRIPT &bull; SUPABASE &bull; PYTHON &bull; DOCKER ]
  </text>
</svg>
