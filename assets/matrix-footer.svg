<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 120" width="100%" height="120">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080c" />
      <stop offset="50%" stop-color="#02140a" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="950" height="120" rx="10" fill="url(#footerBg)" stroke="#00ff41" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- Grid Accents -->
  <line x1="40" y1="20" x2="910" y2="20" stroke="#003811" stroke-width="0.8" />
  <line x1="40" y1="100" x2="910" y2="100" stroke="#003811" stroke-width="0.8" />

  <!-- Binary Code Stream -->
  <text x="475" y="44" text-anchor="middle" font-family="'JetBrains Mono', Courier, monospace" font-size="11" fill="#00ff41" letter-spacing="4" opacity="0.8">
    01010011 01011001 01010011 01010100 01000101 01001101 &bull; 01001111 01010110 01000101 01010010 01010010 01001001 01000100 01000101
  </text>

  <!-- Quote with subtle glow -->
  <text x="475" y="74" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="2" filter="url(#fGlow)">
    &ldquo;There is a difference between knowing the path and walking the path.&rdquo;
  </text>

  <!-- Subtext -->
  <text x="475" y="94" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#39ff14" letter-spacing="3">
    [ SYSTEM ACCESS LOGGED &bull; KEEP BUILDING &bull; NEVER IDLE ]
  </text>
</svg>
